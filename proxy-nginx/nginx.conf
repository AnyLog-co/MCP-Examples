worker_processes 1;

events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # Serve HTML dashboards
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Proxy all /api/query calls to the AnyLog node
        location /api/query {
            proxy_pass ${ANYLOG_NODE_URL};

            proxy_http_version 1.1;
            proxy_pass_request_body    on;
            proxy_pass_request_headers on;
            proxy_set_header Host $proxy_host;

            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, User-Agent" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*";
                add_header Access-Control-Allow-Methods "POST, GET, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, User-Agent";
                return 204;
            }

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }
    }
}
