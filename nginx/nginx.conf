worker_processes 1;

events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # Serve the dashboard HTML
        location / {
            root   /usr/share/nginx/html;
            index  rig_data.html;
            try_files $uri $uri/ /rig_data.html;
        }

        # Proxy all /api/query calls to the AnyLog node
        location /api/query {
            # ── Change this to your AnyLog node address ──
            proxy_pass http://24.5.219.50:7849/;

            proxy_http_version 1.1;

            # Forward the original POST body as-is
            proxy_pass_request_body    on;
            proxy_pass_request_headers on;

            # Strip the path — AnyLog expects POST to / not /api/query
            proxy_set_header Host $proxy_host;

            # CORS headers so the browser is happy
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, User-Agent" always;

            # Handle OPTIONS preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*";
                add_header Access-Control-Allow-Methods "POST, GET, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, User-Agent";
                return 204;
            }

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }
    }
}